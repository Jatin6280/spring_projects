<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Todo App</title>
</head>
<body>

<h1>My Todo List</h1>

<form action="/todos" method="post">
    <input type="text"
           name="task"
           placeholder="Enter your task"
           required>

    <button type="submit">Add Task</button>
</form>

<h2>Saved Tasks</h2>

<ul>
    <li th:each="todo : ${todos}"
        th:text="${todo.task}">
    </li>
</ul>

</body>
</html>
